<!-- 앱처럼 설치 (홈 화면에 추가 → 브라우저 주소창·아래 막대 없이 전체 화면). AcWebBuild가 <head> 바로 뒤에 넣음 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2536">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="크리스마스 파티">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
  window.xpInstallEvt = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.xpInstallEvt = e; if (window.xpInstallShow) window.xpInstallShow(); });
  window.addEventListener("appinstalled", function () { window.xpInstallEvt = null; if (window.xpInstallHide) window.xpInstallHide(); });
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
<script>
  // 창을 내리거나 다른 앱·탭으로 가면 소리 멈춤, 돌아오면 다시 (11-28)
  (function () {
    var ctxs = [];
    ["AudioContext", "webkitAudioContext"].forEach(function (n) {
      var C = window[n]; if (!C) return;
      var W = function () { var c = new (Function.prototype.bind.apply(C, [null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
      W.prototype = C.prototype; window[n] = W;
    });
    function apply() {
      var hide = document.hidden;
      ctxs.forEach(function (c) { try { if (hide) { if (c.state === "running") c.suspend(); } else if (c.state === "suspended") c.resume(); } catch (e) {} });
    }
    document.addEventListener("visibilitychange", apply);
    window.addEventListener("pagehide", function () { ctxs.forEach(function (c) { try { c.suspend(); } catch (e) {} }); });
    window.addEventListener("pageshow", apply);
  })();
</script>
