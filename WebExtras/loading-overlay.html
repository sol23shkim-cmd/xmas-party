<!-- 로딩 화면: 지금 거실에 꾸며진 트리 사진(게임이 찍어 올림) + 제목 + 진행 막대. 사진이 없으면 눈 내리는 마을 영상 (AcWebBuild가 <body> 바로 뒤에 넣음) -->
<style>
  @font-face { font-family: "GowunLoad"; src: url("gowun-load-b.woff") format("woff"); font-weight: 700; font-display: block; }
  @font-face { font-family: "GowunLoad"; src: url("gowun-load.woff") format("woff"); font-weight: 400; font-display: block; }
  #unity-loading-container { display: none !important; }
  #xp-load { position: fixed; inset: 0; z-index: 50; overflow: hidden; background: radial-gradient(ellipse at 50% 70%, #3a4f6b 0%, #1b2536 70%, #121925 100%); transition: opacity .7s ease; font-family: "GowunLoad", "Nanum Myeongjo", "AppleMyungjo", serif; }
  #xp-snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #xp-shot { position: absolute; inset: -3%; background: center 60% / cover no-repeat; opacity: 0; transition: opacity 1.2s ease; animation: xp-drift 18s ease-in-out infinite alternate; }
  #xp-shot.on { opacity: 1; }
  @keyframes xp-drift { from { transform: scale(1.0); } to { transform: scale(1.07) translateY(-1.2%); } }
  #xp-load video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: none; }
  #xp-load::before, #xp-load::after { content: ""; position: absolute; left: 0; right: 0; pointer-events: none; z-index: 1; }
  #xp-load::before { top: 0; height: 42%; background: linear-gradient(to bottom, rgba(20,28,44,.55), rgba(20,28,44,0)); }
  #xp-load::after { bottom: 0; height: 26%; background: linear-gradient(to top, rgba(20,28,44,.6), rgba(20,28,44,0)); }
  #xp-title { position: absolute; z-index: 2; left: 0; right: 0; top: 17%; text-align: center; color: #fffaf0; font-weight: 700; font-size: clamp(40px, 11.5vw, 76px); line-height: 1.15; letter-spacing: .06em;
              text-shadow: 0 2px 4px rgba(20, 30, 50, .35), 0 6px 26px rgba(10, 20, 40, .55); animation: xp-in 1.4s ease-out both; }
  #xp-title::before, #xp-title::after { content: ""; display: block; width: min(46%, 220px); height: 1px; margin: 0 auto; background: linear-gradient(90deg, rgba(247,214,140,0), rgba(247,214,140,.95), rgba(247,214,140,0)); }
  #xp-title::before { margin-bottom: .32em; } #xp-title::after { margin-top: .36em; }
  #xp-bottom { position: absolute; z-index: 2; left: 0; right: 0; bottom: max(7%, 42px); text-align: center; }
  #xp-label { color: #fffaf0; font-size: 16px; letter-spacing: .08em; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #xp-bar { width: min(62%, 320px); height: 10px; margin: 0 auto; border-radius: 6px; background: rgba(255,255,255,.28); box-shadow: inset 0 1px 3px rgba(0,0,0,.25); overflow: hidden; }
  #xp-fill { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #e04a4a, #f7c948); transition: width .3s ease; }
  @keyframes xp-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
<div id="xp-load">
  <div id="xp-shot"></div>
  <video muted loop playsinline webkit-playsinline preload="none"></video>
  <canvas id="xp-snow"></canvas>
  <div id="xp-title">크리스마스 파티</div>
  <div id="xp-bottom"><div id="xp-label">불러오는 중</div><div id="xp-bar"><div id="xp-fill"></div></div></div>
</div>
<script>
  (function () {
    var DB = "https://xmas-plaza-default-rtdb.asia-southeast1.firebasedatabase.app/rooms/xmas/orn/x~shot~tree/img.json";
    var el = document.getElementById("xp-load"), fill = document.getElementById("xp-fill"), label = document.getElementById("xp-label"), v = el.querySelector("video"), shot = document.getElementById("xp-shot");
    var p0 = 0, done = false, bgReady = false, readyCbs = [];
    function fireReady() { bgReady = true; var c = readyCbs; readyCbs = []; c.forEach(function (f) { try { f(); } catch (e) {} }); }
    // 게임 파일은 배경(트리 사진 또는 영상)이 뜬 다음에 받기 시작. 늦어도 2.5초 뒤에는 시작
    window.xpReady = function (cb) { if (bgReady) cb(); else { readyCbs.push(cb); setTimeout(fireReady, 2500); } };
    // 1) 트리 사진
    var fallbackTimer = setTimeout(useVideo, 3000), usedVideo = false;
    fetch(DB, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (b64) {
      if (!b64 || typeof b64 !== "string" || b64.length < 1000 || usedVideo) { if (!usedVideo) useVideo(); return; }
      var img = new Image();
      img.onload = function () { clearTimeout(fallbackTimer); if (usedVideo) return; shot.style.backgroundImage = "url(" + img.src + ")"; shot.classList.add("on"); fireReady(); };
      img.onerror = function () { useVideo(); };
      img.src = "data:image/jpeg;base64," + b64;
    }).catch(function () { useVideo(); });
    // 2) 사진이 아직 없으면: 눈 내리는 마을 영상
    function tryPlay() { try { v.muted = true; v.defaultMuted = true; v.setAttribute("muted", ""); var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} }
    function useVideo() {
      if (usedVideo || shot.classList.contains("on")) return; usedVideo = true; clearTimeout(fallbackTimer);
      v.style.display = "block"; v.poster = "loading.jpg"; v.preload = "auto"; v.src = "loading.mp4?v=2";
      v.addEventListener("playing", fireReady);
      ["loadedmetadata", "canplay"].forEach(function (ev) { v.addEventListener(ev, tryPlay); });
      ["touchstart", "pointerdown"].forEach(function (ev) { document.addEventListener(ev, tryPlay, { passive: true }); });
      tryPlay();
    }
    // 눈 내리기 (사진 위에 살살)
    var cv = document.getElementById("xp-snow"), cx = cv.getContext("2d"), flakes = [];
    for (var i = 0; i < 80; i++) flakes.push({ x: Math.random(), y: Math.random(), r: 0.8 + Math.random() * 2.6, s: 0.03 + Math.random() * 0.07, w: Math.random() * 6 });
    var last = performance.now();
    (function step(t) {
      if (done) return;
      var dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (!usedVideo) {
        var W = cv.width = cv.clientWidth, H = cv.height = cv.clientHeight;
        cx.clearRect(0, 0, W, H); cx.fillStyle = "rgba(255,255,255,0.85)";
        flakes.forEach(function (f) { f.y += f.s * dt * (1 + f.r * 0.3); f.w += dt * 0.8; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
          cx.beginPath(); cx.arc((f.x + Math.sin(f.w) * 0.012) * W, f.y * H, f.r, 0, 6.283); cx.fill(); });
      } else if (cv.width) { cv.width = 0; }
      requestAnimationFrame(step);
    })(last);
    // 진행: 웹 파일 받기(0~60%) → 게임 안에서 모델 받기·집 짓기(60~100%) → 게임이 다 되면 사라짐
    function show(pct, text) {
      if (done) return;
      pct = Math.max(p0, Math.min(99, Math.round(pct))); p0 = pct;
      fill.style.width = pct + "%";
      label.textContent = text != null ? text : "불러오는 중 " + pct + "%";
    }
    window.xpProgress = function (p) { show(p * 60, p >= 1 ? "준비 중" : null); };
    window.xpDone = function () { show(60, "준비 중"); setTimeout(function () { window.xpFinish(); }, 30000); };
    window.xpStage = function (p) {
      if (p < 0) { window.xpFinish(); return; }
      if (p >= 2) show(97, "집 짓는 중");
      else show(60 + p * 36, null);
    };
    window.xpFinish = function () {
      if (done) return; done = true;
      fill.style.width = "100%"; label.textContent = "준비 완료";
      setTimeout(function () { el.style.opacity = "0"; el.style.pointerEvents = "none"; }, 300);
      setTimeout(function () { try { v.pause(); } catch (e) {} el.remove(); }, 1100);
    };
  })();
</script>
