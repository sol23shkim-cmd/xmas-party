<script>
  window.xpInstallEvt = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.xpInstallEvt = e; if (window.xpInstallShow) window.xpInstallShow(); });
  window.addEventListener("appinstalled", function () { window.xpInstallEvt = null; if (window.xpInstallHide) window.xpInstallHide(); });
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });

<script>
  // 창을 내리거나 다른 앱·탭으로 가면 소리 멈춤, 돌아오면 다시 (11-28)
  (function () {
    var ctxs = [];
    ["AudioContext", "webkitAudioContext"].forEach(function (n) {
      var C = window[n]; if (!C) return;
      var W = function () { var c = new (Function.prototype.bind.apply(C, [null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
      W.prototype = C.prototype; window[n] = W;
    });
    function apply() {
      var hide = document.hidden;
      ctxs.forEach(function (c) { try { if (hide) { if (c.state === "running") c.suspend(); } else if (c.state === "suspended") c.resume(); } catch (e) {} });
    }
    document.addEventListener("visibilitychange", apply);
    window.addEventListener("pagehide", function () { ctxs.forEach(function (c) { try { c.suspend(); } catch (e) {} }); });
    window.addEventListener("pageshow", apply);
  })();
</script>


    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>크리스마스 파티</title>

  </head>
  <body>
<!-- 로딩 화면: 지금 거실에 꾸며진 트리 사진(게임이 찍어 올림) + 제목 + 진행 막대. 사진이 없으면 눈 내리는 마을 영상 (AcWebBuild가 <body> 바로 뒤에 넣음) -->
<style>
  @font-face { font-family: "GowunLoad"; src: url("gowun-load-b.woff") format("woff"); font-weight: 700; font-display: block; }
  @font-face { font-family: "GowunLoad"; src: url("gowun-load.woff") format("woff"); font-weight: 400; font-display: block; }
  #unity-loading-container { display: none !important; }
  #xp-load { position: fixed; inset: 0; z-index: 50; overflow: hidden; background: radial-gradient(ellipse at 50% 70%, #3a4f6b 0%, #1b2536 70%, #121925 100%); transition: opacity .7s ease; font-family: "GowunLoad", "Nanum Myeongjo", "AppleMyungjo", serif; }
  #xp-snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #xp-shot { position: absolute; inset: -3%; background: center 60% / cover no-repeat; opacity: 0; transition: opacity 1.2s ease; animation: xp-drift 18s ease-in-out infinite alternate; }
  #xp-shot.on { opacity: 1; }
  @keyframes xp-drift { from { transform: scale(1.0); } to { transform: scale(1.07) translateY(-1.2%); } }
  #xp-load video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: none; }
  #xp-load::before, #xp-load::after { content: ""; position: absolute; left: 0; right: 0; pointer-events: none; z-index: 1; }
  #xp-load::before { top: 0; height: 42%; background: linear-gradient(to bottom, rgba(20,28,44,.55), rgba(20,28,44,0)); }
  #xp-load::after { bottom: 0; height: 26%; background: linear-gradient(to top, rgba(20,28,44,.6), rgba(20,28,44,0)); }
  #xp-title { position: absolute; z-index: 2; left: 0; right: 0; top: 17%; text-align: center; color: #fffaf0; font-weight: 700; font-size: clamp(40px, 11.5vw, 76px); line-height: 1.15; letter-spacing: .06em;
              text-shadow: 0 2px 4px rgba(20, 30, 50, .35), 0 6px 26px rgba(10, 20, 40, .55); animation: xp-in 1.4s ease-out both; }
  #xp-title::before, #xp-title::after { content: ""; display: block; width: min(46%, 220px); height: 1px; margin: 0 auto; background: linear-gradient(90deg, rgba(247,214,140,0), rgba(247,214,140,.95), rgba(247,214,140,0)); }
  #xp-title::before { margin-bottom: .32em; } #xp-title::after { margin-top: .36em; }
  #xp-bottom { position: absolute; z-index: 2; left: 0; right: 0; bottom: max(7%, 42px); text-align: center; }
  #xp-label { color: #fffaf0; font-size: 16px; letter-spacing: .08em; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #xp-bar { width: min(62%, 320px); height: 10px; margin: 0 auto; border-radius: 6px; background: rgba(255,255,255,.28); box-shadow: inset 0 1px 3px rgba(0,0,0,.25); overflow: hidden; }
  #xp-fill { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #e04a4a, #f7c948); transition: width .3s ease; }
  /* 앱으로 받기 버튼 (오른쪽 위) + 안내 */
  #xp-app { position: absolute; z-index: 3; top: max(14px, env(safe-area-inset-top)); right: 14px; display: none; align-items: center; gap: 6px; padding: 9px 14px 9px 11px; border-radius: 22px;
            background: rgba(255, 250, 240, .92); color: #7a1f2b; font: 700 14px/1 "GowunLoad", sans-serif; letter-spacing: .02em; border: 0; box-shadow: 0 3px 12px rgba(0,0,0,.28); cursor: pointer; animation: xp-in 1s .6s ease-out both; }
  #xp-app img { width: 22px; height: 22px; border-radius: 6px; }
  #xp-guide { position: absolute; z-index: 4; top: calc(max(14px, env(safe-area-inset-top)) + 50px); right: 14px; width: min(78vw, 300px); display: none; padding: 14px 16px; border-radius: 14px;
              background: rgba(255, 250, 240, .97); color: #3b2a22; font: 400 14px/1.55 "GowunLoad", sans-serif; box-shadow: 0 6px 22px rgba(0,0,0,.35); }
  #xp-guide b { color: #b3262f; }
  @keyframes xp-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
<div id="xp-load">
  <div id="xp-shot"></div>
  <video muted loop playsinline webkit-playsinline preload="none"></video>
  <canvas id="xp-snow"></canvas>
  <div id="xp-title">크리스마스 파티</div>
  <button id="xp-app" type="button"><img src="icon-192.png" alt="">앱으로 받기</button>
  <div id="xp-guide"></div>
  <div id="xp-bottom"><div id="xp-label">불러오는 중</div><div id="xp-bar"><div id="xp-fill"></div></div></div>
</div>
<script>
  (function () {
    var DB = "https://xmas-plaza-default-rtdb.asia-southeast1.firebasedatabase.app/rooms/xmas/orn/x~shot~tree/img.json";
    var el = document.getElementById("xp-load"), fill = document.getElementById("xp-fill"), label = document.getElementById("xp-label"), v = el.querySelector("video"), shot = document.getElementById("xp-shot");
    var p0 = 0, done = false, bgReady = false, readyCbs = [];
    function fireReady() { bgReady = true; var c = readyCbs; readyCbs = []; c.forEach(function (f) { try { f(); } catch (e) {} }); }
    // 게임 파일은 배경(트리 사진 또는 영상)이 뜬 다음에 받기 시작. 늦어도 2.5초 뒤에는 시작
    window.xpReady = function (cb) { if (bgReady) cb(); else { readyCbs.push(cb); setTimeout(fireReady, 2500); } };
    // 1) 트리 사진
    var fallbackTimer = setTimeout(useVideo, 3000), usedVideo = false;
    fetch(DB, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (b64) {
      if (!b64 || typeof b64 !== "string" || b64.length < 1000 || usedVideo) { if (!usedVideo) useVideo(); return; }
      var img = new Image();
      img.onload = function () { clearTimeout(fallbackTimer); if (usedVideo) return; shot.style.backgroundImage = "url(" + img.src + ")"; shot.classList.add("on"); fireReady(); };
      img.onerror = function () { useVideo(); };
      img.src = "data:image/jpeg;base64," + b64;
    }).catch(function () { useVideo(); });
    // 2) 사진이 아직 없으면: 눈 내리는 마을 영상
    function tryPlay() { try { v.muted = true; v.defaultMuted = true; v.setAttribute("muted", ""); var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} }
    function useVideo() {
      if (usedVideo || shot.classList.contains("on")) return; usedVideo = true; clearTimeout(fallbackTimer);
      v.style.display = "block"; v.poster = "loading.jpg"; v.preload = "auto"; v.src = "loading.mp4?v=2";
      v.addEventListener("playing", fireReady);
      ["loadedmetadata", "canplay"].forEach(function (ev) { v.addEventListener(ev, tryPlay); });
      ["touchstart", "pointerdown"].forEach(function (ev) { document.addEventListener(ev, tryPlay, { passive: true }); });
      tryPlay();
    }
    // 눈 내리기 (사진 위에 살살)
    var cv = document.getElementById("xp-snow"), cx = cv.getContext("2d"), flakes = [];
    for (var i = 0; i < 80; i++) flakes.push({ x: Math.random(), y: Math.random(), r: 0.8 + Math.random() * 2.6, s: 0.03 + Math.random() * 0.07, w: Math.random() * 6 });
    var last = performance.now();
    (function step(t) {
      if (done) return;
      var dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (!usedVideo) {
        var W = cv.width = cv.clientWidth, H = cv.height = cv.clientHeight;
        cx.clearRect(0, 0, W, H); cx.fillStyle = "rgba(255,255,255,0.85)";
        flakes.forEach(function (f) { f.y += f.s * dt * (1 + f.r * 0.3); f.w += dt * 0.8; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
          cx.beginPath(); cx.arc((f.x + Math.sin(f.w) * 0.012) * W, f.y * H, f.r, 0, 6.283); cx.fill(); });
      } else if (cv.width) { cv.width = 0; }
      requestAnimationFrame(step);
    })(last);
    // 진행: 웹 파일 받기(0~60%) → 게임 안에서 모델 받기·집 짓기(60~100%) → 게임이 다 되면 사라짐
    function show(pct, text) {
      if (done) return;
      pct = Math.max(p0, Math.min(99, Math.round(pct))); p0 = pct;
      fill.style.width = pct + "%";
      label.textContent = text != null ? text : "불러오는 중 " + pct + "%";
    }
    window.xpProgress = function (p) { show(p * 60, p >= 1 ? "준비 중" : null); };
    window.xpDone = function () { show(60, "준비 중"); setTimeout(function () { window.xpFinish(); }, 30000); };
    window.xpStage = function (p) {
      if (p < 0) { window.xpFinish(); return; }
      if (p >= 2) show(97, "집 짓는 중");
      else show(60 + p * 36, null);
    };
    // 앱으로 받기: 설치할 수 있는 브라우저는 바로 설치 창, 아니면 '홈 화면에 추가' 방법 안내. 이미 앱으로 열었으면 버튼 숨김
    var appBtn = document.getElementById("xp-app"), guide = document.getElementById("xp-guide");
    var standalone = (window.matchMedia && (matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches)) || navigator.standalone === true;
    var ua = navigator.userAgent, isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document), isKakao = /KAKAOTALK/i.test(ua);
    window.xpInstallShow = function () { if (!standalone && !done) appBtn.style.display = "flex"; };
    window.xpInstallHide = function () { appBtn.style.display = "none"; guide.style.display = "none"; };
    if (!standalone) appBtn.style.display = "flex";
    appBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var ev = window.xpInstallEvt;
      if (ev) { ev.prompt(); ev.userChoice.then(function (r) { if (r && r.outcome === "accepted") window.xpInstallHide(); }).catch(function () {}); window.xpInstallEvt = null; return; }
      guide.innerHTML = isKakao ? "카카오톡 안에서는 설치가 안 돼요.<br>오른쪽 아래 <b>⋮ → 다른 브라우저로 열기</b>를 누른 뒤 다시 '앱으로 받기'를 눌러 주세요."
        : isIOS ? "Safari 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르면<br>주소창 없이 앱처럼 열려요."
        : "브라우저 메뉴(<b>⋮</b> 또는 <b>≡</b>) → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르면<br>주소창 없이 앱처럼 열려요.";
      guide.style.display = guide.style.display === "block" ? "none" : "block";
    });
    window.xpFinish = function () {
      if (done) return; done = true;
      fill.style.width = "100%"; label.textContent = "준비 완료";
      setTimeout(function () { el.style.opacity = "0"; el.style.pointerEvents = "none"; }, 300);
      setTimeout(function () { try { v.pause(); } catch (e) {} el.remove(); }, 1100);
    };
  })();
</script>

    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">

              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">크리스마스 파티</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "xmas-party",
        productName: "크리스마스 파티",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (true) {   // 휴대폰·PC 모두 브라우저 창 전체를 게임 화면으로
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%"; if (window.xpProgress) xpProgress(progress);
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => { if (window.xpDone) xpDone();
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      if (window.xpReady) xpReady(function () { document.body.appendChild(script); }); else document.body.appendChild(script);

    </script>
  </body>
