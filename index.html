<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>크리스마스 파티</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
<!-- 로딩 화면: 눈 내리는 크리스마스 마을 영상 + 제목 + 진행 막대 (AcWebBuild가 index.html의 <body> 바로 뒤에 넣음) -->
<style>
  @font-face { font-family: "GowunLoad"; src: url("gowun-load-b.woff") format("woff"); font-weight: 700; font-display: block; }
  @font-face { font-family: "GowunLoad"; src: url("gowun-load.woff") format("woff"); font-weight: 400; font-display: block; }
  #unity-loading-container { display: none !important; }
  #xp-load { position: fixed; inset: 0; z-index: 50; overflow: hidden; background: #3b4a5a url("loading.jpg") center / cover no-repeat; transition: opacity .7s ease; font-family: "GowunLoad", "Nanum Myeongjo", "AppleMyungjo", serif; }
  #xp-snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
  #xp-load.still { animation: xp-zoom 14s ease-in-out infinite alternate; background-size: auto 112%; }
  @keyframes xp-zoom { from { background-size: auto 104%; } to { background-size: auto 116%; } }
  #xp-load video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 62%; }
  #xp-load::before, #xp-load::after { content: ""; position: absolute; left: 0; right: 0; pointer-events: none; z-index: 1; }
  #xp-load::before { top: 0; height: 42%; background: linear-gradient(to bottom, rgba(20,28,44,.55), rgba(20,28,44,0)); }
  #xp-load::after { bottom: 0; height: 26%; background: linear-gradient(to top, rgba(20,28,44,.6), rgba(20,28,44,0)); }
  #xp-title { position: absolute; z-index: 2; left: 0; right: 0; top: 17%; text-align: center; color: #fffaf0; font-weight: 700; font-size: clamp(40px, 11.5vw, 76px); line-height: 1.15; letter-spacing: .06em;
              text-shadow: 0 2px 4px rgba(20, 30, 50, .35), 0 6px 26px rgba(10, 20, 40, .55); animation: xp-in 1.4s ease-out both; }
  #xp-title::before, #xp-title::after { content: ""; display: block; width: min(46%, 220px); height: 1px; margin: 0 auto; background: linear-gradient(90deg, rgba(247,214,140,0), rgba(247,214,140,.95), rgba(247,214,140,0)); }
  #xp-title::before { margin-bottom: .32em; } #xp-title::after { margin-top: .36em; }
  #xp-bottom { position: absolute; z-index: 2; left: 0; right: 0; bottom: max(7%, 42px); text-align: center; }
  #xp-label { color: #fffaf0; font-size: 16px; letter-spacing: .08em; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #xp-bar { width: min(62%, 320px); height: 10px; margin: 0 auto; border-radius: 6px; background: rgba(255,255,255,.28); box-shadow: inset 0 1px 3px rgba(0,0,0,.25); overflow: hidden; }
  #xp-fill { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #e04a4a, #f7c948); transition: width .3s ease; }
  @keyframes xp-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
<div id="xp-load">
  <video src="loading.mp4?v=2" poster="loading.jpg" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
  <canvas id="xp-snow"></canvas>
  <div id="xp-title">크리스마스 파티</div>
  <div id="xp-bottom"><div id="xp-label">불러오는 중</div><div id="xp-bar"><div id="xp-fill"></div></div></div>
</div>
<script>
  (function () {
    var el = document.getElementById("xp-load"), fill = document.getElementById("xp-fill"), label = document.getElementById("xp-label"), v = el.querySelector("video");
    var p0 = 0, done = false;
    // 영상 재생: 자동 재생이 막히거나 늦으면 여러 번 다시 시도. 끝내 안 되면 그림을 천천히 확대 + 눈 내리기로 움직이게
    var playing = false, readyCbs = [];
    function tryPlay() { try { v.muted = true; v.defaultMuted = true; v.setAttribute("muted", ""); var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} }
    function fireReady() { var c = readyCbs; readyCbs = []; c.forEach(function (f) { try { f(); } catch (e) {} }); }
    v.addEventListener("playing", function () { playing = true; stopSnow(); fireReady(); });
    ["loadedmetadata", "canplay", "canplaythrough"].forEach(function (ev) { v.addEventListener(ev, tryPlay); });
    ["touchstart", "pointerdown", "click"].forEach(function (ev) { document.addEventListener(ev, tryPlay, { passive: true }); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tryPlay(); });
    tryPlay();
    // 게임 파일은 영상이 먼저 나오기 시작한 뒤에 받기 시작 (영상이 먼저 받아지도록). 늦어도 2.5초 뒤에는 시작
    window.xpReady = function (cb) { if (playing) cb(); else { readyCbs.push(cb); setTimeout(fireReady, 2500); } };
    // 대신 움직이는 그림: 눈 내리기
    var snowOn = false, cv = document.getElementById("xp-snow"), cx = cv.getContext("2d"), flakes = [];
    function startSnow() {
      if (playing || snowOn) return; snowOn = true; el.classList.add("still"); cv.style.display = "block";
      for (var i = 0; i < 90; i++) flakes.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 3, s: 0.04 + Math.random() * 0.08, w: Math.random() * 6 });
      var last = performance.now();
      (function step(t) {
        if (!snowOn) return;
        var dt = Math.min(0.05, (t - last) / 1000); last = t;
        var W = cv.width = cv.clientWidth, H = cv.height = cv.clientHeight;
        cx.clearRect(0, 0, W, H); cx.fillStyle = "rgba(255,255,255,0.9)";
        flakes.forEach(function (f) { f.y += f.s * dt * (1 + f.r * 0.3); f.w += dt; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
          cx.beginPath(); cx.arc((f.x + Math.sin(f.w) * 0.01) * W, f.y * H, f.r, 0, 6.283); cx.fill(); });
        requestAnimationFrame(step);
      })(last);
    }
    function stopSnow() { if (!snowOn) return; snowOn = false; cv.style.display = "none"; el.classList.remove("still"); }
    setTimeout(function () { if (!playing) startSnow(); }, 2000);
    // 한 화면으로 끝까지: 웹 파일 받기(0~60%) → 게임 안에서 모델 받기·집 짓기(60~100%) → 게임이 다 되면 사라짐
    function show(pct, text) {
      if (done) return;
      pct = Math.max(p0, Math.min(99, Math.round(pct))); p0 = pct;
      fill.style.width = pct + "%";
      label.textContent = text != null ? text : "불러오는 중 " + pct + "%";
    }
    window.xpProgress = function (p) { show(p * 60, p >= 1 ? "준비 중" : null); };   // 웹 파일
    window.xpDone = function () {   // 웹 파일 끝: 게임이 알려줄 때까지 계속 보여 줌 (혹시 소식이 없으면 30초 뒤 닫음)
      show(60, "준비 중");
      setTimeout(function () { window.xpFinish(); }, 30000);
    };
    window.xpStage = function (p, msg) {   // 게임 안에서: p 0~1 (모델 받기), 2 = 집 짓는 중, -1 = 끝
      if (p < 0) { window.xpFinish(); return; }
      if (p >= 2) show(97, "집 짓는 중");
      else show(60 + p * 36, null);
    };
    window.xpFinish = function () {
      if (done) return; done = true;
      fill.style.width = "100%"; label.textContent = "준비 완료";
      setTimeout(function () { el.style.opacity = "0"; el.style.pointerEvents = "none"; }, 300);
      setTimeout(function () { try { v.pause(); } catch (e) {} el.remove(); }, 1100);
    };
  })();
</script>

    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">크리스마스 파티</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "xmas-party",
        productName: "크리스마스 파티",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (true) {   // 휴대폰·PC 모두 브라우저 창 전체를 게임 화면으로
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%"; if (window.xpProgress) xpProgress(progress);
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => { if (window.xpDone) xpDone();
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      if (window.xpReady) xpReady(function () { document.body.appendChild(script); }); else document.body.appendChild(script);

    </script>
  </body>
</html>
